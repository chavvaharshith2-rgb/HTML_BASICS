<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h3>Unordered List</h3>

    <ol start="5" reversed>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>

    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>

    <h3>Description List</h3>

    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>
    </dl>

    <h3>Nested List</h3>

    <ul>
        <li>Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JS</li>
            </ol>
        </li>

        <li>Backend
            <ol>
                <li>Java</li>
            </ol>
        </li>
    </ul>

</body>
</html>
