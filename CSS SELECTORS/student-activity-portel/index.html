
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Activity Portal</title>

    <style>
        body {
            background-color: lavender;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: Georgia, serif;
        }

        h2, h3 {
            font-family: Verdana, sans-serif;
        }

        p, a, label, input, select, textarea, button {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<header>
    <h1>Student Activity Portal</h1>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#register">Register</a>
</nav>

<main id="home">
    <section id="events">
        <h2>Upcoming Events</h2>

        <article>
            <h3>Technical Fest</h3>
            <p>Date: 25 November 2026</p>
        </article>

        <article>
            <h3>Sports Meet</h3>
            <p>Date: 28 November 2026</p>
        </article>
    </section>

    <aside>
        <h2>Announcements</h2>
        <p>Register early for upcoming events.</p>
    </aside>

    <section id="register">
        <h2>Student Registration</h2>

        <form>
            <label for="name">Student Name:</label>
            <input type="text" id="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <br><br>

            <label for="event">Select Event:</label>
            <select id="event">
                <option>Technical Fest</option>
                <option>Sports Meet</option>
            </select>
            <br><br>

            <p>Gender:</p>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <br><br>

            <input type="checkbox" id="agree">
            <label for="agree">I agree to participate.</label>
            <br><br>

            <label for="message">Comments:</label>
            <textarea id="message"></textarea>
            <br><br>

            <button type="submit">Register</button>
        </form>
    </section>
</main>

<footer>
    <p>Student Activity Portal - University</p>
</footer>

</body>
</html>
